# /etc/nginx/sites-available/ampela — reverse proxy vers l'API NestJS.
# Le bloc HTTPS est ajouté/complété par certbot (--nginx).
server {
    listen 80;
    server_name ampela.178-104-61-143.sslip.io;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket (socket.io) pour la messagerie temps réel
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
